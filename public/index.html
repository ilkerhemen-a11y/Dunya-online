        function createArenaFighterHTML(fighter, side) {
            const icon = side === 'attacker' ? '🛡️' : '⚔️';

            return `
                <div class="arena-fighter-avatar">${icon}</div>
                <div class="arena-fighter-name">${escapeHTML(fighter.username)}</div>
                <div class="arena-fighter-title">🏅 ${escapeHTML(fighter.title || getTitleByLevel(fighter.level || 1))}</div>

                <div class="arena-fighter-stats">
                    <span>Lv ${fighter.level || 1}</span>
                    <span>⚔️ ${fighter.str || 0}</span>
                    <span>🛡️ ${fighter.vit || 0}</span>
                    <span>🔥 Güç ${fighter.power || 0}</span>
                </div>

                <div class="arena-hp-shell">
                    <div
                        id="arenaHpFill_${side}"
                        class="arena-hp-fill"
                        style="width:100%;"
                    ></div>

                    <div
                        id="arenaHpText_${side}"
                        class="arena-hp-text"
                    >${fighter.maxHp}/${fighter.maxHp}</div>
                </div>
            `;
        }

        function setArenaHp(side, hp, maxHp) {
            const safeMax = Math.max(1, Number(maxHp) || 1);
            const safeHp = Math.max(0, Math.min(safeMax, Number(hp) || 0));
            const percent = (safeHp / safeMax) * 100;

            const fill = document.getElementById(`arenaHpFill_${side}`);
            const text = document.getElementById(`arenaHpText_${side}`);

            if (fill) {
                fill.style.width = `${percent}%`;

                if (percent <= 25) {
                    fill.style.background = 'linear-gradient(to right,#991b1b,#ef4444)';
                } else if (percent <= 55) {
                    fill.style.background = 'linear-gradient(to right,#a16207,#eab308)';
                }
            }

            if (text) {
                text.innerText = `${safeHp}/${safeMax}`;
            }
        }

        function spawnArenaDamage(targetCard, damage, critical, finisher) {
            if (!targetCard) return;

            const pop = document.createElement('div');
            pop.className = `arena-damage-pop ${critical ? 'critical' : ''}`;

            pop.innerText = finisher
                ? `💥 SON DARBE -${damage}`
                : critical
                    ? `⚡ KRİTİK! -${damage}`
                    : `-${damage}`;

            targetCard.appendChild(pop);

            setTimeout(() => {
                pop.remove();
            }, 850);
        }

        async function playArenaBattle(battle, finalMessage) {
            if (!battle || activeTab !== 'arena') return;

            const token = ++arenaAnimationToken;

            const attackerCard = document.getElementById('arenaAttackerCard');
            const defenderCard = document.getElementById('arenaDefenderCard');
            const roundLabel = document.getElementById('arenaRoundLabel');
            const feed = document.getElementById('arenaBattleFeed');
            const banner = document.getElementById('arenaResultBanner');

            if (!attackerCard || !defenderCard || !feed) return;

            attackerCard.className = 'arena-fighter attacker';
            defenderCard.className = 'arena-fighter defender';

            attackerCard.innerHTML = createArenaFighterHTML(
                battle.attacker,
                'attacker'
            );

            defenderCard.innerHTML = createArenaFighterHTML(
                battle.defender,
                'defender'
            );

            if (banner) {
                banner.className = 'arena-result-banner';
                banner.innerHTML = '';
            }

            feed.innerHTML = `
                <div>⚔️ ${escapeHTML(battle.attacker.username)} vs ${escapeHTML(battle.defender.username)}</div>
            `;

            await sleepArena(650);

            for (const action of battle.actions || []) {
                if (
                    token !== arenaAnimationToken ||
                    activeTab !== 'arena'
                ) {
                    return;
                }

                const actorSide = action.actor;
                const targetSide = action.target;

                const actorCard = document.getElementById(
                    actorSide === 'attacker'
                        ? 'arenaAttackerCard'
                        : 'arenaDefenderCard'
                );

                const targetCard = document.getElementById(
                    targetSide === 'attacker'
                        ? 'arenaAttackerCard'
                        : 'arenaDefenderCard'
                );

                if (!actorCard || !targetCard) return;

                if (roundLabel) {
                    roundLabel.innerText = action.finisher
                        ? '💥 SON DARBE'
                        : `⚔️ TUR ${action.round}`;
                }

                actorCard.classList.remove('lunge-right', 'lunge-left');
                targetCard.classList.remove('hit');

                void actorCard.offsetWidth;
                void targetCard.offsetWidth;

                actorCard.classList.add(
                    actorSide === 'attacker'
                        ? 'lunge-right'
                        : 'lunge-left'
                );

                await sleepArena(210);

                targetCard.classList.add('hit');

                spawnArenaDamage(
                    targetCard,
                    action.damage,
                    action.critical,
                    action.finisher
                );

                setArenaHp(
                    targetSide,
                    action.targetHp,
                    action.targetMaxHp
                );

                const actorName = actorSide === 'attacker'
                    ? battle.attacker.username
                    : battle.defender.username;

                const targetName = targetSide === 'attacker'
                    ? battle.attacker.username
                    : battle.defender.username;

                const line = document.createElement('div');

                line.innerHTML =
                    `${action.critical ? '⚡ ' : '⚔️ '}` +
                    `<strong>${escapeHTML(actorName)}</strong> → ` +
                    `${escapeHTML(targetName)}: ` +
                    `<span style="color:${action.critical ? '#facc15' : '#f87171'};">-${action.damage} HP</span>` +
                    `${action.finisher ? ' <strong style="color:#f3cf7a;">SON DARBE!</strong>' : ''}`;

                feed.appendChild(line);
                feed.scrollTop = feed.scrollHeight;

                await sleepArena(action.finisher ? 900 : 720);

                actorCard.classList.remove('lunge-right', 'lunge-left');
                targetCard.classList.remove('hit');
            }

            if (
                token !== arenaAnimationToken ||
                activeTab !== 'arena'
            ) {
                return;
            }

            const winnerCard = battle.attackerWon
                ? attackerCard
                : defenderCard;

            const loserCard = battle.attackerWon
                ? defenderCard
                : attackerCard;

            winnerCard.classList.add('winner');
            loserCard.classList.add('loser');

            if (roundLabel) {
                roundLabel.innerText = battle.attackerWon
                    ? '🏆 ZAFER'
                    : '💀 MAĞLUBİYET';
            }

            if (banner) {
                banner.className =
                    `arena-result-banner show ${battle.attackerWon ? 'win' : 'lose'}`;

                banner.innerHTML = battle.attackerWon
                    ? `🏆 ZAFER<div style="font-size:11px; margin-top:5px;">+${battle.goldReward || 0} Altın 🪙 • +${Math.max(0, battle.honorChange || 0)} Onur 🌟</div>`
                    : `💀 MAĞLUBİYET<div style="font-size:11px; margin-top:5px;">${battle.honorChange || -5} Onur 🌟</div>`;
            }

            const logEl = document.getElementById('arenaLogResult');

            if (logEl) {
                logEl.innerText = finalMessage || 'Arena savaşı tamamlandı.';
                logEl.style.fontWeight = 'bold';
                logEl.style.borderColor = battle.attackerWon
                    ? '#d4af37'
                    : '#991b1b';
                logEl.style.color = battle.attackerWon
                    ? '#f3cf7a'
                    : '#fca5a5';
                logEl.style.background = battle.attackerWon
                    ? 'rgba(212,175,55,.08)'
                    : 'rgba(153,27,27,.10)';
            }

            await sleepArena(1500);

            if (
                token === arenaAnimationToken &&
                activeTab === 'arena'
            ) {
                socket.emit('getArenaOpponents');
            }
        }

        function sendChat() {
            const input = document.getElementById('chatInputMsg');
            if(!input || !input.value.trim()) return;
            
            cooldownButton('chatBtn', 1000);
            socket.emit('sendChatMessage', { message: input.value.trim() });
            input.value = '';
        }

        socket.on('statUpdated', (u) => {
            updateHeader(u);
            renderPanelContent();
        });
        socket.on('questResult', (res) => {
            if (res.userData) {
                updateHeader(res.userData);
            }

            if (activeTab === 'work') {
                renderPanelContent();
            }

            const logEl = document.getElementById('questLogResult');

            if (logEl) {
                logEl.innerText = res.message || 'Sefer işlemi tamamlandı.';
                logEl.style.fontWeight = 'bold';
                logEl.style.borderColor = res.success ? '#22c55e' : '#ef4444';
                logEl.style.color = res.success ? '#86efac' : '#fca5a5';
                logEl.style.background = res.success
                    ? 'rgba(34,197,94,.08)'
                    : 'rgba(239,68,68,.08)';
            }
        });
        socket.on('marketResult', (res) => {
            if (res.userData) {
                updateHeader(res.userData);
            }

            if (activeTab === 'market') {
                renderPanelContent();
            }

            const logEl =
                document.getElementById(
                    'marketLogResult'
                );

            if (logEl) {
                logEl.innerText =
                    res.message ||
                    'Market işlemi tamamlandı.';

                logEl.style.fontWeight = 'bold';
                logEl.style.borderColor =
                    res.success
                        ? '#22c55e'
                        : '#ef4444';

                logEl.style.color =
                    res.success
                        ? '#86efac'
                        : '#fca5a5';

                logEl.style.background =
                    res.success
                        ? 'rgba(34,197,94,.08)'
                        : 'rgba(239,68,68,.08)';
            }

            if (
                res.success &&
                res.exchange &&
                activeTab === 'market' &&
                activeMarketCategory === 'exchange'
            ) {
                requestAnimationFrame(() => {
                    playSarrafExchangeAnimation(
                        res.exchange
                    );
                });
            }

            if (
                res.success &&
                res.bankAction &&
                activeTab === 'market' &&
                activeMarketCategory === 'bank'
            ) {
                requestAnimationFrame(() => {
                    playBankAnimation(
                        res.bankAction
                    );
                    updateBankCountdown();
                });
            }
        });
        socket.on('suluhanResult', (res) => { if(res.userData) updateHeader(res.userData); document.getElementById('suluhanLogResult').innerText = res.message; if(activeTab === 'suluhan') renderPanelContent(); });
        socket.on('barracksStatus', (res) => {
            if (res.userData) updateHeader(res.userData);

            barracksState = {
                troops: res.troops || barracksState?.troops,
                castle: res.castle || barracksState?.castle,
                troopPower: res.troopPower || 0,
                commanderStr: res.commanderStr || 0,
                armyPower: res.armyPower || 0,
                armyCount: res.armyCount || 0
            };

            if (
                activeTab === 'barracks' &&
                !castleSiegeAnimating
            ) {
                renderPanelContent();
            }
        });

        socket.on('barracksResult', (res) => {
            if (res.userData) updateHeader(res.userData);

            if (!barracksState) barracksState = {};

            if (res.castle) {
                barracksState.castle = res.castle;
            }

            if (res.troopPower !== undefined) {
                barracksState.troopPower = res.troopPower;
            }

            if (res.commanderStr !== undefined) {
                barracksState.commanderStr = res.commanderStr;
            }

            if (res.armyPower !== undefined) {
                barracksState.armyPower = res.armyPower;
            }

            if (res.armyCount !== undefined) {
                barracksState.armyCount = res.armyCount;
            }

            if (activeTab === 'barracks') {
                renderPanelContent();
            }

            const logEl = document.getElementById('barracksLogResult');

            if (logEl) {
                logEl.innerText = res.message || 'Kışla işlemi tamamlandı.';
                logEl.style.fontWeight = 'bold';
                logEl.style.borderColor = res.success ? '#22c55e' : '#ef4444';
                logEl.style.color = res.success ? '#86efac' : '#fca5a5';
            }
        });

        socket.on('castleBattleResult', (res) => {
            if (res.userData) {
                updateHeader(res.userData);
            }

            if (!barracksState) {
                barracksState = {};
            }

            if (res.castle) {
                barracksState.castle = res.castle;
            }

            if (
                res.battleCompleted &&
                res.battle &&
                activeTab === 'barracks'
            ) {
                playCastleSiegeBattle(
                    res.battle,
                    res.message
                );

                return;
            }

            castleSiegeAnimating = false;

            const btn =
                document.getElementById(
                    'attackCastleBtn'
                );

            if (btn) {
                btn.disabled = false;
                btn.innerText = '⚔️ KALEYİ KUŞAT';
            }

            const logEl =
                document.getElementById(
                    'barracksLogResult'
                );

            if (logEl) {
                logEl.innerText =
                    res.message ||
                    'Kale savaşı tamamlandı.';

                logEl.style.fontWeight = 'bold';
                logEl.style.borderColor =
                    res.success
                        ? '#22c55e'
                        : '#ef4444';

                logEl.style.color =
                    res.success
                        ? '#86efac'
                        : '#fca5a5';
            }
        });

        socket.on('castleRefresh', () => {
            if (castleSiegeAnimating) {
                castleRefreshPending = true;
                return;
            }

            if (activeTab === 'barracks') {
                socket.emit('getBarracksStatus');
            }
        });

        socket.on('castleDefenseNotice', (res) => {
            if (
                activeTab === 'barracks' &&
                !castleSiegeAnimating
            ) {
                socket.emit('getBarracksStatus');
            } else if (castleSiegeAnimating) {
                castleRefreshPending = true;
            }

            const logEl = document.getElementById('barracksLogResult');
            if (logEl && res?.message) {
                logEl.innerText = res.message;
                logEl.style.fontWeight = 'bold';
                logEl.style.color = '#fca5a5';
                logEl.style.borderColor = '#ef4444';
            }
        });

        socket.on('throneAnnouncement', (res) => {
            if (
                activeTab === 'barracks' &&
                !castleSiegeAnimating
            ) {
                socket.emit('getBarracksStatus');
            } else if (castleSiegeAnimating) {
                castleRefreshPending = true;
            }

            const logEl = document.getElementById('barracksLogResult');
            if (logEl && res?.message) {
                logEl.innerText = res.message;
                logEl.style.fontWeight = 'bold';
                logEl.style.color = '#f3cf7a';
                logEl.style.borderColor = '#d4af37';
                logEl.style.background = 'rgba(212,175,55,.08)';
            }
        });

        socket.on('forgeResult', (res) => {
            if (res.userData) updateHeader(res.userData);

            if (activeTab === 'blacksmith') {
                renderPanelContent();
            }

            const logEl = document.getElementById('forgeLogResult');
            if (logEl) {
                logEl.innerText = res.message || 'Demirhane işlemi tamamlandı.';
                logEl.style.fontWeight = 'bold';
                logEl.style.borderColor = res.success ? '#22c55e' : '#ef4444';
                logEl.style.color = res.success ? '#86efac' : '#fca5a5';
                logEl.style.background = res.success
                    ? 'rgba(34,197,94,0.08)'
                    : 'rgba(239,68,68,0.08)';
            }
        });
        socket.on('metinStatus', (res) => {
            if (res.userData) updateHeader(res.userData);
            if (activeTab === 'metin') renderPanelContent();
        });

        socket.on('metinResult', (res) => {
            if (res.userData) updateHeader(res.userData);

            if (activeTab === 'metin') {
                renderPanelContent();
            }

            const logEl = document.getElementById('metinLogResult');
            if (logEl) {
                logEl.innerText = res.message || 'Metin taşı sonucu alındı.';
                logEl.style.fontWeight = 'bold';
                logEl.style.borderColor = res.destroyed ? '#a855f7' : (res.success ? '#f97316' : '#ef4444');
                logEl.style.color = res.destroyed ? '#e9d5ff' : (res.success ? '#fdba74' : '#fca5a5');
                logEl.style.background = res.destroyed
                    ? 'rgba(168,85,247,0.08)'
                    : (res.success ? 'rgba(249,115,22,0.08)' : 'rgba(239,68,68,0.08)');
            }
        });

        socket.on('dungeonResult', (res) => {
            if (res.userData) updateHeader(res.userData);
            if (activeTab === 'dungeon') renderPanelContent();
            const logEl = document.getElementById('dungeonLogResult');
            if (logEl) {
                logEl.innerText = res.message || 'Zindan sonucu alındı.';
                logEl.style.fontWeight = 'bold';
                logEl.style.borderColor = res.success ? '#22c55e' : '#ef4444';
                logEl.style.color = res.success ? '#86efac' : '#fca5a5';
                logEl.style.background = res.success ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)';
            }
        });
        
        socket.on('arenaOpponentsList', (opponents) => {
            const listEl = document.getElementById('arenaOpponentsList');
            const refreshBtn = document.getElementById('arenaRefreshBtn');

            if (refreshBtn) {
                refreshBtn.disabled = false;
                refreshBtn.innerText = '🔄 Rakipleri Yenile';
            }

            if (!listEl) return;

            arenaOpponentCache = {};

            if (!opponents || opponents.length === 0) {
                listEl.innerHTML = `
                    <p style="color:#9c8e7b; font-size:12px; text-align:center;">
                        Şu an başka rakip bulunamadı.
                    </p>
                `;
                return;
            }

            opponents.forEach(op => {
                arenaOpponentCache[String(op._id)] = op;
            });

            listEl.innerHTML = opponents.map(op => {
                const stats = calculateClientArenaStats(op);
                const canFight = (Number(currentUserData?.arenaLimit) || 0) > 0;

                return `
                    <div class="quest-card" style="border-left:3px solid #991b1b;">
                        <div style="font-size:27px; width:36px; text-align:center;">⚔️</div>

                        <div class="quest-info" style="flex:1;">
                            <h4>
                                ${escapeHTML(op.username)}
                                <span style="color:#9c8e7b; font-size:10px;">
                                    Lv ${Math.min(MAX_LEVEL, op.level || 1)}
                                </span>
                            </h4>

                            <p>
                                <span class="title-badge">
                                    🏅 ${getTitleByLevel(op.level || 1)}
                                </span>
                                &nbsp; 🌟 Onur: ${op.honor || 0}
                            </p>

                            <div style="
                                display:flex;
                                gap:9px;
                                flex-wrap:wrap;
                                margin-top:4px;
                                font-size:9px;
                            ">
                                <span style="color:#f97316;">⚔️ STR ${stats.str}</span>
                                <span style="color:#60a5fa;">🛡️ VIT ${stats.vit}</span>
                                <span style="color:#facc15;">🔥 Savaş Gücü ${stats.power}</span>
                            </div>
                        </div>

                        <button
                            id="atkBtn_${op._id}"
                            class="btn-quest"
                            ${canFight ? '' : 'disabled'}
                            style="
                                background:#991b1b;
                                color:white;
                                border-color:#ef4444;
                            "
                            onclick="startArenaChallenge('${op._id}', 'atkBtn_${op._id}')"
                        >⚔️ SAVAŞ</button>
                    </div>
                `;
            }).join('');
        });

        socket.on('arenaResult', (res) => {
            const refreshBtn = document.getElementById('arenaRefreshBtn');

            if (refreshBtn && !res.battleCompleted) {
                refreshBtn.disabled = false;
                refreshBtn.innerText = '🔄 Rakipleri Yenile';
            }

            if (res.userData) {
                updateHeader(res.userData);

                const honorEl = document.getElementById('arenaHonorValue');
                const limitEl = document.getElementById('arenaLimitValue');

                if (honorEl) {
                    honorEl.innerText = res.userData.honor || 0;
                }

                if (limitEl) {
                    limitEl.innerText = `${res.userData.arenaLimit ?? 0}/5`;
                }
            }

            if (res.battleCompleted && res.battle && activeTab === 'arena') {
                playArenaBattle(res.battle, res.message);
                return;
            }

            const logEl = document.getElementById('arenaLogResult');

            if (logEl) {
                logEl.innerText = res.message || 'Arena işlemi tamamlandı.';
                logEl.style.fontWeight = 'bold';
                logEl.style.borderColor = res.success ? '#22c55e' : '#ef4444';
                logEl.style.color = res.success ? '#86efac' : '#fca5a5';
            }

            if (activeTab === 'arena') {
                socket.emit('getArenaOpponents');
            }
        });

        socket.on('receiveChatMessage', (data) => {
            const box = document.getElementById('chatMessagesBox');
            if(box) { 
                const safeName = escapeHTML(data.username);
                const safeMsg = escapeHTML(data.message);
                box.innerHTML += `<div class="chat-msg"><span>${safeName}:</span> ${safeMsg}</div>`; 
                box.scrollTop = box.scrollHeight; 
            }
        });

        function logout() { 
            localStorage.removeItem('throne_token');
            socket.emit('logout'); 
        }

        socket.on('logoutSuccess', () => { 
            document.getElementById('mainApp').style.display = 'none'; 
            document.getElementById('loginModal').style.display = 'flex'; 
            currentUserData = null; 
            document.getElementById('authMessage').innerText = "Başarıyla çıkış yapıldı.";
        });

        socket.on('errorMessage', (msg) => {
            alert(msg);
        });

    </script>
</body>
</html>
