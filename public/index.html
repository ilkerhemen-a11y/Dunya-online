<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taht Savaşı — İmparatorluk Sistemi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0b0908;
            background-image: radial-gradient(circle at center, #1c1510 0%, #080605 100%);
            color: #d4c5b9; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px;
        }

        .game-header {
            width: 100%;
            max-width: 1000px;
            background: linear-gradient(to bottom, #1d1712, #0e0a08);
            border: 1px solid #433222;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            font-size: 12px;
        }

        .header-section { display: flex; align-items: center; gap: 15px; }
        .resource-item { display: flex; align-items: center; gap: 6px; font-weight: bold; color: #f3cf7a; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .bar-container { display: flex; flex-direction: column; gap: 2px; }
        .stat-bar-mini { width: 110px; height: 12px; background: #080605; border: 1px solid #33241b; border-radius: 3px; position: relative; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8); }
        .stat-bar-fill { height: 100%; background: linear-gradient(to right, #22c55e, #15803d); width: 100%; transition: width 0.3s ease; }
        .stat-bar-fill.exp { background: linear-gradient(to right, #eab308, #a16207); width: 0%; }
        .stat-bar-fill.sefer { background: linear-gradient(to right, #3b82f6, #1e40af); width: 100%; }

        .main-wrapper {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 210px 1fr;
            gap: 15px;
        }

        .sidebar-menu {
            background: linear-gradient(to bottom, #17120e, #0a0705);
            border: 1px solid #433222;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: fit-content;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .menu-category-title {
            text-align: center;
            background: #231b14;
            color: #f3cf7a;
            font-size: 11px;
            font-weight: bold;
            padding: 5px;
            border: 1px solid #3d2f23;
            border-radius: 4px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .menu-btn {
            background: #110d0a;
            border: 1px solid #2d2017;
            color: #b5a494;
            padding: 8px 12px;
            text-align: left;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-btn:hover {
            background: #241c15;
            border-color: #d4af37;
            color: #f3cf7a;
            transform: translateX(2px);
        }

        .content-panel {
            background: linear-gradient(135deg, #1b1410 0%, #0d0a08 100%);
            border: 1px solid #433222;
            border-radius: 6px;
            padding: 20px;
            min-height: 520px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
            position: relative;
        }

        .panel-title {
            font-size: 15px;
            font-weight: bold;
            color: #f3cf7a;
            border-bottom: 1px solid #33241b;
            padding-bottom: 10px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .modal-overlay { 
            position: fixed; 
            inset: 0; 
            /* Meta.ai ile tasarlanan arka plan görseli ve hafif karartma */
            background: linear-gradient(rgba(8, 6, 5, 0.65), rgba(8, 6, 5, 0.75)), url('https://i.hizliresim.com/0jtt3f0i.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 99; 
        }
        .box { background: #140f0c; padding: 30px; border-radius: 6px; border: 2px solid #b38b4d; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); }
        .box h2 { color: #f3cf7a; margin-bottom: 8px; font-size: 20px; }
        .box p { color: #9c8e7b; font-size: 12px; margin-bottom: 20px; }
        .box input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #3d2f23; background: #080605; color: #f3cf7a; text-align: center; margin-bottom: 12px; font-size: 14px; }
        .btn-primary { width: 100%; padding: 10px; border: 1px solid #ffdf73; border-radius: 4px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #d4af37 0%, #997415 100%); color: #0b0908; font-size: 14px; }

        @media (max-width: 768px) {
            .main-wrapper { grid-template-columns: 1fr; }
            .game-header { flex-direction: column; gap: 8px; padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- Giriş Ekranı (Meta.ai Arka Planlı) -->
    <div id="loginModal" class="modal-overlay">
        <div class="box">
            <h2>Antik Diyara Adım At</h2>
            <p>Mücadelene başlamak için kahramanının adını gir.</p>
            <input type="text" id="usernameInput" placeholder="Gladyatör / Lord Adı" maxlength="15">
            <button class="btn-primary" onclick="login()">MEYDANA İN</button>
        </div>
    </div>

    <!-- Üst Bilgi Çubuğu -->
    <header class="game-header">
        <div class="header-section">
            <div class="resource-item">🪙 <span id="headerGold">0</span> Altın</div>
            <div class="resource-item" style="color: #ef4444;">💎 <span id="headerRubies">10</span> Yakut</div>
        </div>
        <div class="header-section">
            <div class="bar-container">
                <span id="hpLabel" style="font-size: 10px; color: #9c8e7b;">Can Puanı</span>
                <div class="stat-bar-mini"><div id="hpBarFill" class="stat-bar-fill" style="width: 100%;"></div></div>
            </div>
            <div class="bar-container">
                <span id="expLabel" style="font-size: 10px; color: #9c8e7b;">Tecrübe</span>
                <div class="stat-bar-mini"><div id="expBarFill" class="stat-bar-fill exp" style="width: 0%;"></div></div>
            </div>
            <div class="bar-container">
                <span id="seferLabel" style="font-size: 10px; color: #9c8e7b;">Sefer Limiti (20/20)</span>
                <div class="stat-bar-mini"><div id="seferBarFill" class="stat-bar-fill sefer" style="width: 100%;"></div></div>
            </div>
        </div>
    </header>

    <!-- Ana Oyun Çerçevesi -->
    <div class="main-wrapper" id="mainApp" style="display: none;">
        
        <!-- Sol Dikey Menü -->
        <nav class="sidebar-menu">
            <div class="menu-category-title">İmparatorluk</div>
            <button class="menu-btn" onclick="switchTab('overview')">🏛️ Genel Durum</button>
            <button class="menu-btn" onclick="switchTab('work')">⚔️ İş / Görevler</button>
            <button class="menu-btn" onclick="switchTab('market')">🛒 Pazar Yeri</button>
            <button class="menu-btn" onclick="switchTab('timar')">🏰 Tımarlar</button>
            <button class="menu-btn" onclick="switchTab('blacksmith')">⚒️ Demirhane</button>
            
            <div class="menu-category-title" style="margin-top: 8px;">Topluluk</div>
            <button class="menu-btn" onclick="switchTab('chat')">📜 Diyar Meclisi</button>
        </nav>

        <!-- Sağ İçerik Paneli -->
        <main class="content-panel">
            <div class="panel-title">
                <span id="panelHeaderTitle">Genel Durum & Karakter</span>
                <span id="myUsernameDisplay" style="font-size: 12px; color: #9c8e7b;">Seviye 1</span>
            </div>
            
            <div id="panelContentBody">
                <!-- Dinamik içerik -->
            </div>
        </main>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUserData = null;
        let activeTab = 'overview';
        let seferTimerInterval = null;

        function login() {
            const username = document.getElementById('usernameInput').value;
            if(!username) return;
            socket.emit('userLogin', { username: username });
        }

        socket.on('userData', (data) => {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('mainApp').style.display = 'grid';
            currentUserData = data;
            updateHeader(data);
            switchTab('overview');
            startSeferTimer();
        });
    </script>
</body>
</html>
