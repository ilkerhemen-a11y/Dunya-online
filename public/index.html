<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taht Savaşı — İmparatorluk Sistemi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #121212;
            background-image: radial-gradient(circle, #2a2218 0%, #0c0906 100%);
            color: #d4c5b9; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px;
        }

        /* Üst Oyun Çubuğu */
        .game-header {
            width: 100%;
            max-width: 1000px;
            background: linear-gradient(to bottom, #2b231c, #16120e);
            border: 2px solid #544131;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            font-size: 12px;
        }

        .header-section { display: flex; align-items: center; gap: 15px; }
        .resource-item { display: flex; align-items: center; gap: 5px; font-weight: bold; color: #f3cf7a; }
        .bar-container { display: flex; flex-direction: column; gap: 2px; }
        .stat-bar-mini { width: 110px; height: 12px; background: #111; border: 1px solid #433222; border-radius: 2px; position: relative; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: linear-gradient(to right, #22c55e, #16a34a); width: 100%; transition: width 0.3s ease; }
        .stat-bar-fill.exp { background: linear-gradient(to right, #eab308, #ca8a04); width: 0%; transition: width 0.3s ease; }

        /* Ana Oyun Alanı */
        .main-wrapper {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 15px;
        }

        /* Sol Dikey Menü */
        .sidebar-menu {
            background: linear-gradient(to bottom, #1d1712, #110d0a);
            border: 2px solid #544131;
            border-radius: 4px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            height: fit-content;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }

        .menu-category-title {
            text-align: center;
            background: #2b231c;
            color: #f3cf7a;
            font-size: 11px;
            font-weight: bold;
            padding: 4px;
            border: 1px solid #433222;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .menu-btn {
            background: #18130f;
            border: 1px solid #3d2f23;
            color: #d4c5b9;
            padding: 7px 10px;
            text-align: left;
            font-size: 12px;
            border-radius: 2px;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .menu-btn:hover {
            background: #2b231c;
            border-color: #f3cf7a;
            color: #f3cf7a;
        }

        /* Sağ İçerik Paneli */
        .content-panel {
            background: linear-gradient(135deg, #241c15 0%, #15100c 100%);
            border: 2px solid #544131;
            border-radius: 4px;
            padding: 20px;
            min-height: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            position: relative;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #f3cf7a;
            border-bottom: 1px solid #433222;
            padding-bottom: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Gladiatus Karakter Grid Düzeni */
        .character-screen {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .char-stats-box {
            background: #18130f;
            border: 1px solid #433222;
            padding: 15px;
            border-radius: 4px;
        }

        .char-stats-box h3 {
            font-size: 14px;
            color: #f3cf7a;
            margin-bottom: 10px;
            border-bottom: 1px solid #33241b;
            padding-bottom: 5px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            padding: 5px 0;
            border-bottom: 1px dashed #281d15;
        }

        .stat-row span:first-child { color: #a3957f; }
        .stat-row span:nth-child(2) { color: #f3cf7a; font-weight: bold; }

        .btn-stat {
            background: #b38b4d;
            border: none;
            color: #0f0a08;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
        }
        .btn-stat:hover { background: #f3cf7a; }

        /* Karakter Resmi Çerçevesi */
        .char-portrait {
            width: 100%;
            margin-top: 15px;
            border: 2px solid #544131;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .char-portrait img {
            width: 100%;
            display: block;
            filter: brightness(0.9) contrast(1.1);
        }

        /* Ekipman Ekranı (Gladiatus Slotları) */
        .equipment-grid-wrapper {
            background: #18130f;
            border: 1px solid #433222;
            padding: 15px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .eq-slots-container {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(4, 50px);
            gap: 8px;
            justify-content: center;
        }

        .eq-slot {
            background: #110d0a;
            border: 2px solid #433222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #433222;
            cursor: pointer;
            transition: 0.2s;
        }

        .eq-slot:hover { border-color: #b38b4d; }

        /* Ortak Liste & Kart Yapıları */
        .quest-list, .market-list, .forge-list { display: flex; flex-direction: column; gap: 10px; }
        .quest-card, .market-card, .forge-card {
            background: #18130f;
            border: 1px solid #433222;
            border-radius: 4px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .quest-card:hover, .market-card:hover, .forge-card:hover { border-color: #b38b4d; background: #1e1712; }
        
        .quest-info h4, .market-info h4, .forge-info h4 { color: #f3cf7a; font-size: 14px; margin-bottom: 3px; }
        .quest-info p, .market-info p, .forge-info p { color: #a3957f; font-size: 11px; margin-bottom: 6px; }
        .quest-rewards { font-size: 11px; color: #22c55e; display: flex; gap: 10px; font-weight: bold; }
        .market-income { font-size: 11px; color: #38bdf8; font-weight: bold; }
        .forge-cost { font-size: 11px; color: #ef4444; font-weight: bold; }

        .btn-quest {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            border: 1px solid #543d2b;
            color: #0f0a08;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
            transition: 0.1s;
            white-space: nowrap;
        }
        .btn-quest:hover { background: #f3cf7a; }
        
        .quest-log {
            margin-top: 15px;
            background: #110d0a;
            border: 1px solid #33241b;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #a3957f;
            min-height: 40px;
        }

        /* Sohbet (Diyar Meclisi) Alanı */
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 420px;
        }
        .chat-messages {
            flex: 1;
            background: #110d0a;
            border: 1px solid #33241b;
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }
        .chat-msg { border-bottom: 1px dashed #221a14; padding-bottom: 4px; }
        .chat-msg span { color: #f3cf7a; font-weight: bold; }
        .chat-input-area {
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            background: #110d0a;
            border: 1px solid #433222;
            border-radius: 2px;
            padding: 8px;
            color: #d4c5b9;
            font-size: 12px;
        }
        .chat-input-area input:focus { outline: none; border-color: #b38b4d; }

        /* Giriş Modalı */
        .modal-overlay { position: fixed; inset: 0; background: rgba(10, 6, 4, 0.95); display: flex; justify-content: center; align-items: center; z-index: 99; }
        .box { background: #17100c; padding: 30px; border-radius: 4px; border: 2px solid #b38b4d; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); }
        .box h2 { color: #f3cf7a; margin-bottom: 8px; font-size: 22px; }
        .box p { color: #a3957f; font-size: 13px; margin-bottom: 20px; }
        .box input { width: 100%; padding: 10px; border-radius: 2px; border: 1px solid #543d2b; background: #0f0a08; color: #f3cf7a; text-align: center; margin-bottom: 12px; font-size: 14px; }
        .btn-primary { width: 100%; padding: 10px; border: 1px solid #b38b4d; border-radius: 2px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); color: #0f0a08; font-size: 14px; }

        @media (max-width: 768px) {
            .main-wrapper { grid-template-columns: 1fr; }
            .character-screen { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Giriş Ekranı -->
    <div id="loginModal" class="modal-overlay">
        <div class="box">
            <h2>Antik Diyara Adım At</h2>
            <p>Mücadelene başlamak için kahramanının adını gir.</p>
            <input type="text" id="usernameInput" placeholder="Gladyatör / Lord Adı" maxlength="15">
            <button class="btn-primary" onclick="login()">MEYDANA İN</button>
        </div>
    </div>

    <!-- Üst Bilgi Çubuğu -->
    <header class="game-header">
        <div class="header-section">
            <div class="resource-item">🪙 <span id="headerGold">0</span> Altın</div>
            <div class="resource-item" style="color: #ef4444;">💎 <span id="headerRubies">10</span> Yakut</div>
        </div>
        <div class="header-section">
            <div class="bar-container">
                <span id="hpLabel" style="font-size: 10px; color: #a3957f;">Can Puanı</span>
                <div class="stat-bar-mini"><div id="hpBarFill" class="stat-bar-fill" style="width: 100%;"></div></div>
            </div>
            <div class="bar-container">
                <span id="expLabel" style="font-size: 10px; color: #a3957f;">Tecrübe</span>
                <div class="stat-bar-mini"><div id="expBarFill" class="stat-bar-fill exp" style="width: 0%;"></div></div>
            </div>
        </div>
    </header>

    <!-- Ana Oyun Çerçevesi -->
    <div class="main-wrapper" id="mainApp" style="display: none;">
        
        <!-- Sol Dikey Menü -->
        <nav class="sidebar-menu">
            <div class="menu-category-title">İmparatorluk</div>
            <button class="menu-btn" onclick="switchTab('overview')">🏛️ Genel Durum</button>
            <button class="menu-btn" onclick="switchTab('work')">⚔️ İş / Görevler</button>
            <button class="menu-btn" onclick="switchTab('market')">🛒 Pazar Yeri</button>
            <button class="menu-btn" onclick="switchTab('blacksmith')">⚒️ Demirhane</button>
            
            <div class="menu-category-title" style="margin-top: 8px;">Topluluk</div>
            <button class="menu-btn" onclick="switchTab('chat')">📜 Diyar Meclisi</button>
        </nav>

        <!-- Sağ İçerik Paneli -->
        <main class="content-panel">
            <div class="panel-title">
                <span id="panelHeaderTitle">Genel Durum & Karakter</span>
                <span id="myUsernameDisplay" style="font-size: 13px; color: #a3957f;">Seviye 1</span>
            </div>
            
            <div id="panelContentBody">
                <!-- Burası dinamik olarak dolacak -->
            </div>
        </main>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUserData = null;

        function login() {
            const username = document.getElementById('usernameInput').value;
            if(!username) return;
            socket.emit('userLogin', { username: username });
        }

        socket.on('userData', (data) => {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('mainApp').style.display = 'grid';
            currentUserData = data;
            updateHeader(data);
            switchTab('overview');
        });

        function updateHeader(data) {
            if(!data) return;
            currentUserData = data;
            
            // Altın ve Kullanıcı Adı
            document.getElementById('headerGold').innerText = (data.balance || 0).toLocaleString('tr-TR');
            document.getElementById('myUsernameDisplay').innerText = `${(data.username || 'GLADYATÖR').toUpperCase()} (Seviye ${data.level || 1})`;

            // CAN (HP) DİNAMİK GÜNCELLEME
            const maxHp = (data.vit || 5) * 20;
            const currentHp = (data.hp !== undefined) ? data.hp : maxHp;
            const hpPercent = Math.max(0, Math.min(100, (currentHp / maxHp) * 100));

            const hpBarFill = document.getElementById('hpBarFill');
            const hpLabel = document.getElementById('hpLabel');
            if(hpBarFill) hpBarFill.style.width = `${hpPercent}%`;
            if(hpLabel) hpLabel.innerText = `Can (${currentHp}/${maxHp})`;

            // TECRÜBE (EXP) DİNAMİK GÜNCELLEME
            const maxExp = (data.level || 1) * 100;
            const expPercent = Math.max(0, Math.min(100, ((data.exp || 0) / maxExp) * 100));

            const expBarFill = document.getElementById('expBarFill');
            const expLabel = document.getElementById('expLabel');
            if(expBarFill) expBarFill.style.width = `${expPercent}%`;
            if(expLabel) expLabel.innerText = `XP (%${Math.floor(expPercent)})`;
        }

        function switchTab(tabId) {
            const titleEl = document.getElementById('panelHeaderTitle');
            const bodyEl = document.getElementById('panelContentBody');
            
            if(tabId === 'overview') {
                titleEl.innerText = "Genel Durum & Karakter";
                renderOverviewTab(bodyEl);
            } else if(tabId === 'work') {
                titleEl.innerText = "İş / Görev Alanı (Seferler)";
                renderWorkTab(bodyEl);
            } else if(tabId === 'market') {
                titleEl.innerText = "Pazar Yeri & Tımarlar";
                renderMarketTab(bodyEl);
            } else if(tabId === 'blacksmith') {
                titleEl.innerText = "Demirhane (+ Basma)";
                renderBlacksmithTab(bodyEl);
            } else if(tabId === 'chat') {
                titleEl.innerText = "Diyar Meclisi (Sohbet)";
                renderChatTab(bodyEl);
            }
        }

        function renderOverviewTab(container) {
            const d = currentUserData || { vit: 5, int: 5, str: 5, dex: 5, statPoints: 0 };
            
            container.innerHTML = `
                <div class="character-screen">
                    <!-- Sol: Nitelikler ve Karakter Resmi -->
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        <div class="char-stats-box">
                            <h3>Nitelikler (Puan: <span id="statPoints" style="color:#76aab8;">${d.statPoints || 0}</span>)</h3>
                            <div class="stat-row"><span>Güç:</span> <div><b>${d.str || 5}</b> <button class="btn-stat" onclick="addStat('str')">+</button></div></div>
                            <div class="stat-row"><span>Beceri:</span> <div><b>${d.int || 5}</b> <button class="btn-stat" onclick="addStat('int')">+</button></div></div>
                            <div class="stat-row"><span>Çeviklik:</span> <div><b>${d.dex || 5}</b> <button class="btn-stat" onclick="addStat('dex')">+</button></div></div>
                            <div class="stat-row"><span>Dayanıklılık:</span> <div><b>${d.vit || 5}</b> <button class="btn-stat" onclick="addStat('vit')">+</button></div></div>
                        </div>
                        
                        <!-- Karakter Resmi -->
                        <div class="char-portrait">
                            <img src="https://i.hizliresim.com/swvsuo4s.jpg" alt="Karakterim">
                        </div>
                    </div>

                    <!-- Sağ: Ekipman Slotları -->
                    <div class="equipment-grid-wrapper">
                        <span style="font-size: 12px; color: #a3957f; margin-bottom: 10px;">Kuşatılan Ekipmanlar</span>
                        <div class="eq-slots-container">
                            <div class="eq-slot" title="Kask">🪖</div>
                            <div class="eq-slot" title="Kolye">📿</div>
                            <div class="eq-slot" title="Zırh">🛡️</div>
                            <div class="eq-slot" title="Silah">⚔️</div>
                            <div class="eq-slot" title="Kalkan">🛡️</div>
                            <div class="eq-slot" title="Yüzük">💍</div>
                            <div class="eq-slot" title="Eldiven">🧤</div>
                            <div class="eq-slot" title="Bot">👢</div>
                            <div class="eq-slot" title="İksir">🧪</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWorkTab(container) {
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                    <p style="color: #a3957f; font-size: 12px;">Antik toprakların tehlikeli bölgelerine seferler düzenleyerek şan, tecrübe ve altın kazan.</p>
                    <button class="btn-quest" style="background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); color:#fff;" onclick="socket.emit('usePotion')">🧪 İksir İç (50 Altın)</button>
                </div>
                
                <div class="quest-list">
                    <div class="quest-card">
                        <div class="quest-info">
                            <h4>🌲 Karanlık Orman Bandidoları</h4>
                            <p>Orman yollarını kesen haydutların kampına baskın düzenle.</p>
                            <div class="quest-rewards"><span>🪙 45 Altın</span><span>✨ 20 XP</span></div>
                        </div>
                        <button class="btn-quest" onclick="startQuest(1)">Sefer Düzenle</button>
                    </div>

                    <div class="quest-card">
                        <div class="quest-info">
                            <h4>🏛️ Unutulmuş Tapınak Harabeleri</h4>
                            <p>Lanetli kalıntıların arasındaki antik koruyucularla dövüş.</p>
                            <div class="quest-rewards"><span>🪙 120 Altın</span><span>✨ 55 XP</span></div>
                        </div>
                        <button class="btn-quest" onclick="startQuest(2)">Sefer Düzenle</button>
                    </div>

                    <div class="quest-card">
                        <div class="quest-info">
                            <h4>🐉 Ejderha Dağı Etekleri</h4>
                            <p>Zirvedeki vahşi yaratıklarla yüzleş ve imparatorluk hazinesini ele geçir.</p>
                            <div class="quest-rewards"><span>🪙 300 Altın</span><span>✨ 140 XP</span></div>
                        </div>
                        <button class="btn-quest" onclick="startQuest(3)">Sefer Düzenle</button>
                    </div>
                </div>

                <div id="questLog" class="quest-log">Sefer için hazır bekliyorsun... Lordum, bir hedef seçin.</div>
            `;
        }

        function renderMarketTab(container) {
            container.innerHTML = `
                <p style="color: #a3957f; font-size: 12px; margin-bottom: 15px;">İmparatorluk sınırları içerisinde tımarlar ve mülkler satın alarak düzenli pasif gelir elde et.</p>
                
                <div class="market-list">
                    <div class="market-card">
                        <div class="market-info">
                            <h4>🌾 Küçük Buğday Çiftliği</h4>
                            <p>Verimli ovalarda küçük bir tarım arazisi.</p>
                            <div class="market-income">Maliyet: 500 Altın | +10 Altın/dk Pasif Gelir</div>
                        </div>
                        <button class="btn-quest" onclick="buyEstate(1)">Satın Al</button>
                    </div>

                    <div class="market-card">
                        <div class="market-info">
                            <h4>🍷 Üzüm Bağı ve Şaraphane</h4>
                            <p>Diyar genelinde değerli şaraplar üreten tesis.</p>
                            <div class="market-income">Maliyet: 2.000 Altın | +45 Altın/dk Pasif Gelir</div>
                        </div>
                        <button class="btn-quest" onclick="buyEstate(2)">Satın Al</button>
                    </div>

                    <div class="market-card">
                        <div class="market-info">
                            <h4>🏰 Sınır Kalesi ve Ticaret Noktası</h4>
                            <p>Kervanlardan geçiş vergisi toplayan stratejik kale.</p>
                            <div class="market-income">Maliyet: 7.500 Altın | +180 Altın/dk Pasif Gelir</div>
                        </div>
                        <button class="btn-quest" onclick="buyEstate(3)">Satın Al</button>
                    </div>
                </div>

                <div id="marketLog" class="quest-log">Pazar yeri tüccarları emrinizde, lordum.</div>
            `;
        }

        function renderBlacksmithTab(container) {
            const upgrades = currentUserData && currentUserData.upgrades ? currentUserData.upgrades : { weapon: 0, armor: 0, helmet: 0 };
            
            container.innerHTML = `
                <p style="color: #a3957f; font-size: 12px; margin-bottom: 15px;">Usta demircinin örsünde teçhizatlarını güçlendirerek (+ basarak) savaş gücünü katla.</p>
                
                <div class="forge-list">
                    <div class="forge-card">
                        <div class="forge-info">
                            <h4>⚔️ Gladyatör Kılıcı (+<span id="lvlWeapon">${upgrades.weapon}</span>)</h4>
                            <p>Saldırı gücünü artırır.</p>
                            <div class="forge-cost">Yükseltme Bedeli: <span id="costWeapon">${(upgrades.weapon + 1) * 100}</span> Altın</div>
                        </div>
                        <button class="btn-quest" onclick="upgradeItem('weapon')">+ Bas</button>
                    </div>

                    <div class="forge-card">
                        <div class="forge-info">
                            <h4>🛡️ Savaş Zırhı (+<span id="lvlArmor">${upgrades.armor}</span>)</h4>
                            <p>Savunma ve dayanıklılığı artırır.</p>
                            <div class="forge-cost">Yükseltme Bedeli: <span id="costArmor">${(upgrades.armor + 1) * 100}</span> Altın</div>
                        </div>
                        <button class="btn-quest" onclick="upgradeItem('armor')">+ Bas</button>
                    </div>

                    <div class="forge-card">
                        <div class="forge-info">
                            <h4>🪖 Çelik Kask (+<span id="lvlHelmet">${upgrades.helmet}</span>)</h4>
                            <p>Kritik direnci ve zihinsel gücü artırır.</p>
                            <div class="forge-cost">Yükseltme Bedeli: <span id="costHelmet">${(upgrades.helmet + 1) * 100}</span> Altın</div>
                        </div>
                        <button class="btn-quest" onclick="upgradeItem('helmet')">+ Bas</button>
                    </div>
                </div>

                <div id="forgeLog" class="quest-log">Örsün ateşi harlı, demirci geliştirmeler için hazır bekliyor...</div>
            `;
        }

        function renderChatTab(container) {
            container.innerHTML = `
                <p style="color: #a3957f; font-size: 12px; margin-bottom: 10px;">Diyar Meclisi'nde diğer hanedanlıklarla fikir alışverişi yap ve fısıldaş.</p>
                
                <div class="chat-container">
                    <div id="chatMessages" class="chat-messages">
                        <div class="chat-msg"><span>Sistem:</span> Diyar Meclisi'ne hoş geldiniz, lordlar.</div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Meclise bir söz söyle..." maxlength="120" onkeypress="handleChatKey(event)">
                        <button class="btn-quest" onclick="sendChatMessage()">Gönder</button>
                    </div>
                </div>
            `;
        }

        function addStat(statName) {
            socket.emit('distributeStat', statName);
        }

        function startQuest(questId) {
            socket.emit('doQuest', { questId: questId });
        }

        function buyEstate(estateId) {
            socket.emit('buyEstate', { estateId: estateId });
        }

        function upgradeItem(itemType) {
            socket.emit('upgradeItem', { itemType: itemType });
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if(!input || !input.value.trim()) return;
            socket.emit('sendChatMessage', { message: input.value.trim() });
            input.value = '';
        }

        function handleChatKey(e) {
            if(e.key === 'Enter') sendChatMessage();
        }

        socket.on('statUpdated', (data) => {
            currentUserData = data;
            updateHeader(data);
            renderOverviewTab(document.getElementById('panelContentBody'));
        });

        socket.on('questResult', (data) => {
            currentUserData = data.userData;
            updateHeader(currentUserData);
            const logEl = document.getElementById('questLog');
            if(logEl) {
                logEl.innerHTML = `<b style="color: #f3cf7a;">${data.message}</b> <br><span style="color: #22c55e;">Kazanılan: ${data.goldEarned} Altın, ${data.expEarned} XP</span>`;
            }
        });

        socket.on('marketResult', (data) => {
            currentUserData = data.userData;
            updateHeader(currentUserData);
            const logEl = document.getElementById('marketLog');
            if(logEl) {
                logEl.innerHTML = `<b style="color: #f3cf7a;">${data.message}</b>`;
            }
        });

        socket.on('forgeResult', (data) => {
            currentUserData = data.userData;
            updateHeader(currentUserData);
            const lvlEl = document.getElementById(`lvl${data.itemType.charAt(0).toUpperCase() + data.itemType.slice(1)}`);
            const costEl = document.getElementById(`cost${data.itemType.charAt(0).toUpperCase() + data.itemType.slice(1)}`);
            if(lvlEl) lvlEl.innerText = data.newLevel;
            if(costEl) costEl.innerText = (data.newLevel + 1) * 100;

            const logEl = document.getElementById('forgeLog');
            if(logEl) {
                logEl.innerHTML = `<b style="color: #22c55e;">${data.message}</b>`;
            }
        });

        socket.on('receiveChatMessage', (data) => {
            const chatBox = document.getElementById('chatMessages');
            if(chatBox) {
                const div = document.createElement('div');
                div.className = 'chat-msg';
                div.innerHTML = `<span>${data.username}:</span> ${data.message}`;
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
    </script>
</body>
</html>
