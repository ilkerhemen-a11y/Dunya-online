<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>TAHT SAVAŞI</title>
    <style>
        body { background: #2e003e; color: #ffd700; font-family: 'Georgia', serif; padding: 20px; text-align: center; }
        .hero-card { background: #1a0024; border: 2px solid #ffd700; border-radius: 20px; padding: 30px; margin: auto; max-width: 600px; }
        h1 { font-size: 36px; color: #ffd700; text-transform: uppercase; text-shadow: 2px 2px 4px #000; }
        .stats-bar { display: flex; justify-content: space-around; background: #3d004d; padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px solid #ffd700; }
        .tab-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 20px; }
        .tab-btn { background: #4b0060; border: 1px solid #ffd700; color: #ffd700; padding: 10px; cursor: pointer; border-radius: 5px; }
        .tab-btn.active { background: #ffd700; color: #2e003e; font-weight: bold; }
        .content-area { margin-top: 20px; min-height: 200px; }
        .btn-action { background: #ffd700; color: #2e003e; border: none; padding: 12px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .log-box { background: #000; color: #fff; padding: 10px; font-size: 14px; margin-top: 20px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="hero-card">
        <h1>TAHT SAVAŞI</h1>
        <div class="stats-bar">
            <div>Altın: <span id="myBalance">0</span></div>
            <div>Dayanıklılık: <span id="myEnergy">100</span></div>
            <div>Meslek: <span id="myJob">Çiftçi</span></div>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="showTab('zanaat')">Zanaat</button>
            <button class="tab-btn" onclick="showTab('gorevler')">Görevler</button>
            <button class="tab-btn" onclick="showTab('diger')">Pazar</button>
        </div>

        <div id="content" class="content-area">
            <!-- İçerik buraya dinamik gelecek -->
            <button class="btn-action" onclick="performCraft()">Zanaat Yap (Çalış)</button>
        </div>

        <div id="log" class="log-box">Krallığa hoş geldin, soylu yolcu.</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let username = prompt("Kullanıcı adın nedir?") || "Yolcu";

        socket.emit('userLogin', { username });

        socket.on('userData', (user) => {
            document.getElementById('myBalance').innerText = user.balance;
            document.getElementById('myEnergy').innerText = user.energy;
            document.getElementById('myJob').innerText = user.job;
        });

        socket.on('gameLog', (msg) => {
            document.getElementById('log').innerText = msg;
        });

        function performCraft() {
            socket.emit('performCraft', { username });
        }

        function showTab(tab) {
            const content = document.getElementById('content');
            if(tab === 'zanaat') {
                content.innerHTML = `<button class="btn-action" onclick="performCraft()">Zanaat Yap (Çalış)</button>`;
            } else if(tab === 'gorevler') {
                content.innerHTML = `<h3>Görev Panosu</h3><button class="btn-action" onclick="completeQuest('quest1', 2000, 'Tahta İlk Adım')">Tahta İlk Adım (1000 Altın Biriktir)</button>`;
            }
        }

        function completeQuest(id, reward, name) {
            socket.emit('completeQuest', { username, questId: id, reward, questName: name });
        }
    </script>
</body>
</html>
