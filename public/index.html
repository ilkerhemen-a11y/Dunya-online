<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Taht Savaşı — İmparatorluk</title>
    <style>
        :root { --gold: #d4af37; --bg: #0b0908; --panel: #1b1410; }
        body { background: var(--bg); color: #d4c5b9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .game-header { width: 100%; max-width: 800px; background: #1d1712; padding: 15px; border-radius: 6px; display: flex; justify-content: space-between; margin-bottom: 20px; }
        .main-wrapper { width: 100%; max-width: 800px; display: grid; grid-template-columns: 200px 1fr; gap: 20px; }
        .panel { background: var(--panel); padding: 20px; border-radius: 6px; min-height: 400px; }
        .menu-btn { display: block; width: 100%; padding: 10px; margin-bottom: 5px; background: #110d0a; border: 1px solid #333; color: white; cursor: pointer; text-align: left; }
        .menu-btn:hover { background: #241c15; border-color: var(--gold); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .box { background: #140f0c; padding: 30px; width: 300px; border: 1px solid var(--gold); text-align: center; }
        input { width: 100%; padding: 8px; margin: 5px 0; background: #000; border: 1px solid #444; color: white; }
        .btn { padding: 10px 20px; background: var(--gold); border: none; cursor: pointer; font-weight: bold; width: 100%; }
        .chat-box { height: 250px; overflow-y: scroll; border: 1px solid #333; margin-bottom: 10px; padding: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="loginModal" class="modal">
        <div class="box">
            <h2 id="authTitle">Giriş Yap</h2>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <input type="password" id="password" placeholder="Şifre">
            <button class="btn" onclick="sendAuth()">GÖNDER</button>
            <p onclick="toggleAuth()" style="cursor:pointer; font-size:12px; margin-top:10px;">Hesabın yok mu? Kayıt Ol</p>
            <p id="authMsg" style="color:red; font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <!-- OYUN ARAYÜZÜ -->
    <header class="game-header" id="mainApp" style="display: none;">
        <div>Gladyatör: <span id="uName"></span></div>
        <div>Altın: <span id="gold">0</span></div>
        <button onclick="logout()">Çıkış Yap</button>
    </header>

    <div class="main-wrapper" id="gameUI" style="display: none;">
        <nav>
            <button class="menu-btn" onclick="socket.emit('doQuest', {questId: 1})">⚔️ Sefer Et</button>
            <button class="menu-btn" onclick="alert('Pazar yakında!')">🛒 Pazar</button>
            <button class="menu-btn" onclick="switchTab('chat')">📜 Sohbet</button>
        </nav>
        <main class="panel" id="panelContent">
            <h3>Hoşgeldin Lordum!</h3>
            <p>Seferlere çıkarak altın topla ve imparatorluğunu kur.</p>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let isRegister = false;

        function toggleAuth() {
            isRegister = !isRegister;
            document.getElementById('authTitle').innerText = isRegister ? "Kayıt Ol" : "Giriş Yap";
        }

        function sendAuth() {
            const data = { 
                username: document.getElementById('username').value, 
                password: document.getElementById('password').value 
            };
            socket.emit(isRegister ? 'userRegister' : 'userLogin', data);
        }

        socket.on('authResult', (res) => {
            document.getElementById('authMsg').innerText = res.message;
        });

        socket.on('userData', (user) => {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            document.getElementById('gameUI').style.display = 'grid';
            updateUI(user);
        });

        socket.on('statUpdated', (user) => updateUI(user));

        function updateUI(user) {
            document.getElementById('uName').innerText = user.username;
            document.getElementById('gold').innerText = user.balance;
        }

        function switchTab(tab) {
            if(tab === 'chat') {
                document.getElementById('panelContent').innerHTML = `
                    <h3>Sohbet</h3>
                    <div class="chat-box" id="chat"></div>
                    <input type="text" id="msgInput" placeholder="Mesaj yaz...">
                    <button class="btn" onclick="sendChat()">Gönder</button>
                `;
            }
        }

        function sendChat() {
            const m = document.getElementById('msgInput').value;
            socket.emit('sendChatMessage', { message: m });
            document.getElementById('msgInput').value = '';
        }

        socket.on('receiveChatMessage', (data) => {
            const chat = document.getElementById('chat');
            if(chat) chat.innerHTML += `<div><b>${data.username}:</b> ${data.message}</div>`;
        });

        function logout() { socket.emit('logout'); }
        socket.on('logoutSuccess', () => { location.reload(); });
    </script>
</body>
</html>
