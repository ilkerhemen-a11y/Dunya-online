<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taht Savaşı — İmparatorluk Sistemi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0b0908;
            background-image: radial-gradient(circle at center, #1c1510 0%, #080605 100%);
            color: #d4c5b9; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px;
        }

        .game-header {
            width: 100%;
            max-width: 1000px;
            background: linear-gradient(to bottom, #1d1712, #0e0a08);
            border: 1px solid #433222;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            font-size: 12px;
        }

        .header-section { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .resource-item { display: flex; align-items: center; gap: 5px; font-weight: bold; color: #f3cf7a; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .bar-container { display: flex; flex-direction: column; gap: 2px; }
        .stat-bar-mini { width: 100px; height: 12px; background: #080605; border: 1px solid #33241b; border-radius: 3px; position: relative; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8); }
        .stat-bar-fill { height: 100%; background: linear-gradient(to right, #22c55e, #15803d); width: 100%; transition: width 0.3s ease; }
        .stat-bar-fill.exp { background: linear-gradient(to right, #eab308, #a16207); width: 0%; }

        .main-wrapper {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 210px 1fr;
            gap: 15px;
        }

        .sidebar-menu {
            background: linear-gradient(to bottom, #17120e, #0a0705);
            border: 1px solid #433222;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: fit-content;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .menu-category-title {
            text-align: center;
            background: #231b14;
            color: #f3cf7a;
            font-size: 11px;
            font-weight: bold;
            padding: 5px;
            border: 1px solid #3d2f23;
            border-radius: 4px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .menu-btn {
            background: #110d0a;
            border: 1px solid #2d2017;
            color: #b5a494;
            padding: 8px 12px;
            text-align: left;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-btn:hover { background: #241c15; border-color: #d4af37; color: #f3cf7a; transform: translateX(2px); }
        .menu-btn.logout-btn { border-color: #5b2828; color: #e57373; }
        .menu-btn.logout-btn:hover { background: #2a1515; border-color: #ef5350; color: #ff8a80; }

        .content-panel {
            background: linear-gradient(135deg, #1b1410 0%, #0d0a08 100%);
            border: 1px solid #433222;
            border-radius: 6px;
            padding: 20px;
            min-height: 520px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
            position: relative;
        }

        .panel-title {
            font-size: 15px;
            font-weight: bold;
            color: #f3cf7a;
            border-bottom: 1px solid #33241b;
            padding-bottom: 10px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .character-screen { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .char-stats-box { background: #120e0c; border: 1px solid #33241b; padding: 15px; border-radius: 6px; }
        .char-stats-box h3 { font-size: 13px; color: #f3cf7a; margin-bottom: 12px; border-bottom: 1px solid #221912; padding-bottom: 6px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 6px 0; border-bottom: 1px dashed #1e150f; }
        .stat-row span:first-child { color: #9c8e7b; }
        .stat-row span:nth-child(2) { color: #f3cf7a; font-weight: bold; }

        .btn-stat { background: linear-gradient(to bottom, #d4af37, #997415); border: 1px solid #ffdf73; color: #0b0908; padding: 2px 7px; font-size: 11px; font-weight: bold; border-radius: 3px; cursor: pointer; }
        .btn-stat:hover { filter: brightness(1.15); }

        .char-portrait { width: 100%; margin-top: 15px; border: 1px solid #433222; border-radius: 6px; overflow: hidden; background: #000; }
        .char-portrait img { width: 100%; display: block; filter: brightness(0.9) contrast(1.1); }

        .quest-list, .market-list, .forge-list { display: flex; flex-direction: column; gap: 10px; }
        .quest-card, .market-card, .forge-card { background: #120e0c; border: 1px solid #33241b; border-radius: 6px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .quest-info h4, .market-info h4, .forge-info h4 { color: #f3cf7a; font-size: 13px; margin-bottom: 3px; }
        .quest-info p, .market-info p, .forge-info p { color: #9c8e7b; font-size: 11px; margin-bottom: 6px; }
        .quest-rewards { font-size: 11px; color: #22c55e; display: flex; gap: 10px; font-weight: bold; }
        .market-income { font-size: 11px; color: #38bdf8; font-weight: bold; }
        .forge-cost { font-size: 11px; color: #ef4444; font-weight: bold; }

        .btn-quest { background: linear-gradient(135deg, #d4af37 0%, #997415 100%); border: 1px solid #ffdf73; color: #0b0908; padding: 8px 14px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .btn-quest:hover:not(:disabled) { filter: brightness(1.1); }
        .btn-quest:disabled { background: #231b14; color: #594738; border-color: #2e231b; cursor: not-allowed; }
        
        .quest-log { margin-top: 15px; background: #0d0a08; border: 1px solid #2d2017; padding: 10px; border-radius: 6px; font-size: 12px; color: #9c8e7b; min-height: 40px; }
        
        /* Eski Envanter Grid Stili */
        .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .inv-slot { background: #120e0c; border: 1px solid #33241b; border-radius: 6px; min-height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; font-size: 11px; text-align: center; cursor: pointer; }
        .inv-slot:hover { border-color: #d4af37; background: #1b1410; }

        .chat-container { display: flex; flex-direction: column; gap: 10px; height: 420px; }
        .chat-messages { flex: 1; background: #0d0a08; border: 1px solid #2d2017; border-radius: 6px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
        .chat-msg { border-bottom: 1px dashed #1e150f; padding-bottom: 4px; }
        .chat-msg span { color: #f3cf7a; font-weight: bold; }
        .chat-input-area { display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; background: #0d0a08; border: 1px solid #3d2f23; border-radius: 4px; padding: 8px; color: #d4c5b9; font-size: 12px; }
        .chat-input-area input:focus { outline: none; border-color: #d4af37; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(8, 6, 5, 0.95); display: flex; justify-content: center; align-items: center; z-index: 99; }
        .box { background: #140f0c; padding: 30px; border-radius: 6px; border: 2px solid #b38b4d; width: 90%; max-width: 380px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); }
        .box h2 { color: #f3cf7a; margin-bottom: 8px; font-size: 20px; text-align: center;}
        
        .auth-tabs { display: flex; margin-bottom: 15px; border-bottom: 1px solid #3d2f23; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; color: #9c8e7b; cursor: pointer; font-size: 14px; font-weight: bold; border-bottom: 2px solid transparent; }
        .auth-tab.active { color: #f3cf7a; border-bottom-color: #d4af37; }
        .auth-form { display: none; text-align: center; }
        .auth-form.active { display: block; }
        .auth-form p { color: #9c8e7b; font-size: 12px; margin-bottom: 20px; }
        .box input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #3d2f23; background: #080605; color: #f3cf7a; text-align: center; margin-bottom: 12px; font-size: 14px; }
        #authMessage { margin-bottom: 10px; font-size: 12px; font-weight: bold; min-height: 15px; text-align: center; }
        .btn-primary { width: 100%; padding: 10px; border: 1px solid #ffdf73; border-radius: 4px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #d4af37 0%, #997415 100%); color: #0b0908; font-size: 14px; }

        @media (max-width: 768px) {
            .main-wrapper { grid-template-columns: 1fr; }
            .character-screen { grid-template-columns: 1fr; }
            .game-header { flex-direction: column; gap: 8px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="loginModal" class="modal-overlay">
        <div class="box">
            <h2>Antik Diyara Adım At</h2>
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchAuthTab('login')">Giriş Yap</div>
                <div class="auth-tab" onclick="switchAuthTab('register')">Kayıt Ol</div>
            </div>
            <div id="authMessage"></div>
            <div id="loginForm" class="auth-form active">
                <p>Savaşa geri dön lordum.</p>
                <input type="text" id="loginUsername" placeholder="Gladyatör Adı" maxlength="15">
                <input type="password" id="loginPassword" placeholder="Şifreniz">
                <button class="btn-primary" onclick="login()">MEYDANA İN</button>
            </div>
            <div id="registerForm" class="auth-form">
                <p>Yeni bir efsane doğuyor...</p>
                <input type="text" id="regUsername" placeholder="Yeni Gladyatör Adı" maxlength="15">
                <input type="password" id="regPassword" placeholder="Bir Şifre Belirle">
                <button class="btn-primary" onclick="register()">KAYIT OL</button>
            </div>
        </div>
    </div>

    <!-- Üst Bilgi Çubuğu (Sefer Limiti Geri Eklendi) -->
    <header class="game-header">
        <div class="header-section">
            <div class="resource-item">🪙 <span id="headerGold">0</span> Altın</div>
            <div class="resource-item" style="color: #38bdf8;">⚡ Sefer: <span id="headerSefer">30</span>/30</div>
            <div class="resource-item" style="color: #a855f7;">🧠 <span id="headerTactical">0</span> Taktik</div>
        </div>
        <div class="header-section">
            <div class="bar-container">
                <span id="hpLabel" style="font-size: 10px; color: #9c8e7b;">Can</span>
                <div class="stat-bar-mini"><div id="hpBarFill" class="stat-bar-fill" style="width: 100%;"></div></div>
            </div>
            <div class="bar-container">
                <span id="expLabel" style="font-size: 10px; color: #9c8e7b;">EXP</span>
                <div class="stat-bar-mini"><div id="expBarFill" class="stat-bar-fill exp" style="width: 0%;"></div></div>
            </div>
        </div>
    </header>

    <div class="main-wrapper" id="mainApp" style="display: none;">
        <nav class="sidebar-menu">
            <div class="menu-category-title">İmparatorluk</div>
            <button class="menu-btn" onclick="switchTab('overview')">🏛️ Genel Durum</button>
            <button class="menu-btn" onclick="switchTab('work')">⚔️ Seferler (30 Hak)</button>
            <button class="menu-btn" onclick="switchTab('tactics')">🧠 Savaş Taktikleri</button>
            <button class="menu-btn" onclick="switchTab('timar')">🏰 Tımarlar</button>
            <button class="menu-btn" onclick="switchTab('blacksmith')">⚒️ Demirhane</button>
            
            <div class="menu-category-title" style="margin-top: 8px;">Topluluk</div>
            <button class="menu-btn" onclick="switchTab('chat')">📜 Diyar Meclisi</button>
            <button class="menu-btn logout-btn" onclick="logout()">🚪 Çıkış Yap</button>
        </nav>

        <main class="content-panel">
            <div class="panel-title">
                <span id="panelHeaderTitle">Genel Durum & Karakter</span>
                <span id="myUsernameDisplay" style="font-size: 12px; color: #9c8e7b;">Seviye 1</span>
            </div>
            <div id="panelContentBody"></div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUserData = null;
        let activeTab = 'overview';

        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(el => el.classList.remove('active'));
            document.getElementById('authMessage').innerText = "";
            
            if(tab === 'login') {
                document.querySelector('.auth-tab:nth-child(1)').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelector('.auth-tab:nth-child(2)').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function showAuthError(msg, isSuccess = false) {
            const msgEl = document.getElementById('authMessage');
            msgEl.innerText = msg;
            msgEl.style.color = isSuccess ? '#22c55e' : '#ef4444';
        }

        function login() {
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;
            if(!u || !p) return showAuthError("Bilgileri eksiksiz giriniz.");
            socket.emit('userLogin', { username: u, password: p });
        }

        function register() {
            const u = document.getElementById('regUsername').value;
            const p = document.getElementById('regPassword').value;
            if(!u || !p) return showAuthError("Bilgileri eksiksiz giriniz.");
            socket.emit('userRegister', { username: u, password: p });
        }

        socket.on('authResult', (data) => {
            showAuthError(data.message, data.success);
            if(data.success && document.getElementById('registerForm').classList.contains('active')) {
                setTimeout(() => switchAuthTab('login'), 2000);
            }
        });

        socket.on('userData', (data) => {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('mainApp').style.display = 'grid';
            currentUserData = data;
            updateHeader(data);
            switchTab('overview');
        });

        function updateHeader(data) {
            if(!data) return;
            currentUserData = data;
            
            document.getElementById('headerGold').innerText = (data.balance || 0).toLocaleString('tr-TR');
            document.getElementById('headerSefer').innerText = data.seferLimiti !== undefined ? data.seferLimiti : 30;
            document.getElementById('headerTactical').innerText = data.taktikPuani || 0;
            document.getElementById('myUsernameDisplay').innerText = `${(data.username || 'GLADYATÖR').toUpperCase()} (Seviye ${data.level || 1})`;

            const maxHp = (data.vit || 5) * 20;
            const currentHp = (data.hp !== undefined) ? data.hp : maxHp;
            const hpPercent = Math.max(0, Math.min(100, (currentHp / maxHp) * 100));
            document.getElementById('hpBarFill').style.width = `${hpPercent}%`;
            document.getElementById('hpLabel').innerText = `Can (${currentHp}/${maxHp})`;

            const maxExp = (data.level || 1) * 100;
            const expPercent = Math.max(0, Math.min(100, ((data.exp || 0) / maxExp) * 100));
            document.getElementById('expBarFill').style.width = `${expPercent}%`;
            document.getElementById('expLabel').innerText = `EXP (${data.exp || 0}/${maxExp})`;
        }

        function switchTab(tabName) {
            activeTab = tabName;
            const titleEl = document.getElementById('panelHeaderTitle');
            
            if (tabName === 'overview') {
                titleEl.innerText = "Genel Durum & Envanter";
                renderOverview();
            } else if (tabName === 'work') {
                titleEl.innerText = "Günlük Seferler (30 Hak)";
                renderQuests();
            } else if (tabName === 'tactics') {
                titleEl.innerText = "Savaş Yetenekleri & Taktik Ağacı";
                renderTactics();
            } else if (tabName === 'timar') {
                titleEl.innerText = "Tımarlar & Pasif Gelirler";
                renderEstates();
            } else if (tabName === 'blacksmith') {
                titleEl.innerText = "Demirhane & Ekipman Geliştirme";
                renderBlacksmith();
            } else if (tabName === 'chat') {
                titleEl.innerText = "Diyar Meclisi (Genel Sohbet)";
                renderChat();
            }
        }

        function renderOverview() {
            if(!currentUserData) return;
            const d = currentUserData;
            const inv = d.inventory || [];
            
            let invSlotsHTML = '';
            for(let i = 0; i < 8; i++) {
                if(inv[i]) {
                    invSlotsHTML += `<div class="inv-slot" onclick="equipItem(${i})"><span style="color:#f3cf7a; font-weight:bold;">${inv[i].name}</span><span style="font-size:10px; color:#22c55e;">Kuşan</span></div>`;
                } else {
                    invSlotsHTML += `<div class="inv-slot" style="color:#433222;">Boş Yuva</div>`;
                }
            }

            document.getElementById('panelContentBody').innerHTML = `
                <div class="character-screen">
                    <div class="char-stats-box">
                        <h3>Gladyatör Nitelikleri</h3>
                        <div class="stat-row"><span>Güç (STR):</span> <div><span>${d.str}</span> ${d.statPoints > 0 ? `<button class="btn-stat" onclick="distribute('str')">+</button>` : ''}</div></div>
                        <div class="stat-row"><span>Dayanıklılık (VIT):</span> <div><span>${d.vit}</span> ${d.statPoints > 0 ? `<button class="btn-stat" onclick="distribute('vit')">+</button>` : ''}</div></div>
                        <div class="stat-row"><span>Boşta Stat Puanı:</span> <span style="color:#22c55e;">${d.statPoints}</span></div>
                        <div class="stat-row"><span>Can Puanı (HP):</span> <span>${d.hp} / ${d.vit * 20}</span></div>
                        <div style="margin-top: 15px;">
                            <button class="btn-quest" onclick="usePotion()" style="width:100%;">❤️ Can İksiri İç (50 Altın)</button>
                        </div>
                    </div>
                    <div class="char-portrait">
                        <img src="https://i.hizliresim.com/hnneaa5l.jpg" alt="Gladyatör">
                    </div>
                </div>
                <div style="margin-top:20px;">
                    <h3 style="font-size:13px; color:#f3cf7a; margin-bottom:8px;">Eski Envanter & Çanta</h3>
                    <div class="inventory-grid">${invSlotsHTML}</div>
                </div>
            `;
        }

        function distribute(stat) { socket.emit('distributeStat', stat); }
        function usePotion() { socket.emit('usePotion'); }
        function equipItem(index) { socket.emit('equipItem', { itemIndex: index }); }

        function renderQuests() {
            document.getElementById('panelContentBody').innerHTML = `
                <div class="quest-list">
                    <div class="quest-card">
                        <div class="quest-info">
                            <h4>Karanlık Orman</h4>
                            <p>Ormandaki eşkiyaları temizle.</p>
                            <div class="quest-rewards"><span>🪙 45 Altın</span><span>✨ 20 EXP</span><span>❤️ 15 Can</span></div>
                        </div>
                        <button class="btn-quest" onclick="doQuest(1)">Sefere Çık</button>
                    </div>
                    <div class="quest-card">
                        <div class="quest-info">
                            <h4>Unutulmuş Tapınak</h4>
                            <p>Antik tapınaktakilerin sırlarını çöz.</p>
                            <div class="quest-rewards"><span>🪙 120 Altın</span><span>✨ 55 EXP</span><span>❤️ 35 Can</span></div>
                        </div>
                        <button class="btn-quest" onclick="doQuest(2)">Sefere Çık</button>
                    </div>
                    <div class="quest-card">
                        <div class="quest-info">
                            <h4>Ejderha Dağı</h4>
                            <p>Zirvedeki ejderha yuvasına meydan oku!</p>
                            <div class="quest-rewards"><span>🪙 300 Altın</span><span>✨ 140 EXP</span><span>❤️ 70 Can</span></div>
                        </div>
                        <button class="btn-quest" onclick="doQuest(3)">Sefere Çık</button>
                    </div>
                </div>
                <div id="questLog" class="quest-log">Sefer sonuçları burada raporlanacak...</div>
            `;
        }

        function doQuest(questId) { socket.emit('doQuest', { questId }); }
        socket.on('questResult', (res) => {
            if(res.userData) updateHeader(res.userData);
            const log = document.getElementById('questLog');
            if(log) log.innerText = res.message;
        });

        function renderTactics() {
            const d = currentUserData;
            const skills = d.skills || { kritik: 0, vampir: 0, bereket: 0 };

            document.getElementById('panelContentBody').innerHTML = `
                <div style="font-size: 12px; color: #9c8e7b; margin-bottom: 15px;">
                    Seferlerde kazandığınız Taktik Puanları ile yeteneklerinizi açın.<br>
                    Mevcut Taktik Puanınız: <span style="color:#38bdf8; font-weight:bold;">${d.taktikPuani || 0}</span>
                </div>
                <div class="forge-list">
                    <div class="forge-card">
                        <div class="forge-info">
                            <h4>Kritik Vuruş (Seviye ${skills.kritik})</h4>
                            <p>Ölümcül darbe şansını artırır.</p>
                            <div class="forge-cost" style="color:#38bdf8;">Maliyet: 1 Taktik Puanı</div>
                        </div>
                        <button class="btn-quest" onclick="upgradeSkill('kritik')">Geliştir</button>
                    </div>
                    <div class="forge-card">
                        <div class="forge-info">
                            <h4>Vampirizm (Seviye ${skills.vampir})</h4>
                            <p>Savaş yeteneği direncini artırır.</p>
                            <div class="forge-cost" style="color:#38bdf8;">Maliyet: 1 Taktik Puanı</div>
                        </div>
                        <button class="btn-quest" onclick="upgradeSkill('vampir')">Geliştir</button>
                    </div>
                    <div class="forge-card">
                        <div class="forge-info">
                            <h4>Bereket (Seviye ${skills.bereket})</h4>
                            <p>Sefer altınlarını %3 artırır.</p>
                            <div class="forge-cost" style="color:#38bdf8;">Maliyet: 1 Taktik Puanı</div>
                        </div>
                        <button class="btn-quest" onclick="upgradeSkill('bereket')">Geliştir</button>
                    </div>
                </div>
                <div id="tacticsLog" class="quest-log" style="margin-top:15px;">Taktik merkezi hazır...</div>
            `;
        }

        function upgradeSkill(skillName) { socket.emit('upgradeSkill', { skillName }); }
        socket.on('skillResult', (res) => {
            if(res.userData) { updateHeader(res.userData); if(activeTab === 'tactics') renderTactics(); }
            const log = document.getElementById('tacticsLog');
            if(log) log.innerText = res.message;
        });

        function renderEstates() {
            const has1 = currentUserData.estates.includes(1);
            const has2 = currentUserData.estates.includes(2);
            const has3 = currentUserData.estates.includes(3);

            document.getElementById('panelContentBody').innerHTML = `
                <div class="market-list">
                    <div class="market-card">
                        <div class="market-info">
                            <h4>Küçük Tarla</h4>
                            <p>Pasif gelir getirir.</p>
                            <div class="market-income">Pasif Gelir: +10 Altın / dk</div>
                        </div>
                        <button class="btn-quest" ${has1 ? 'disabled':''} onclick="buyEstate(1)">${has1 ? 'Sahipsiniz' : '500 Altın - Satın Al'}</button>
                    </div>
                    <div class="market-card">
                        <div class="market-info">
                            <h4>Zeytinlik</h4>
                            <p>Geniş zeytin ağaçlarıyla dolu mülk.</p>
                            <div class="market-income">Pasif Gelir: +45 Altın / dk</div>
                        </div>
                        <button class="btn-quest" ${has2 ? 'disabled':''} onclick="buyEstate(2)">${has2 ? 'Sahipsiniz' : '2000 Altın - Satın Al'}</button>
                    </div>
                    <div class="market-card">
                        <div class="market-info">
                            <h4>Altın Madeni</h4>
                            <p>İmparatorluğun en değerli madeni.</p>
                            <div class="market-income">Pasif Gelir: +180 Altın / dk</div>
                        </div>
                        <button class="btn-quest" ${has3 ? 'disabled':''} onclick="buyEstate(3)">${has3 ? 'Sahipsiniz' : '7500 Altın - Satın Al'}</button>
                    </div>
                </div>
                <div id="estateLog" class="quest-log" style="margin-top:15px;">Mülk durumu hazır...</div>
            `;
        }

        function buyEstate(estateId) { socket.emit('buyEstate', { estateId }); }
        socket.on('marketResult', (res) => {
            if(res.userData) { updateHeader(res.userData); if(activeTab==='timar') renderEstates(); }
            const log = document.getElementById('estateLog');
            if(log) log.innerText = res.message;
        });

        function renderBlacksmith() {
            const up = currentUserData.upgrades || { weapon: 0, armor: 0, helmet: 0 };
            document.getElementById('panelContentBody').innerHTML = `
                <div class="forge-list">
                    <div class="forge-card">
                        <div class="forge-info">
                            <h4>Silah Geliştirme (+${up.weapon})</h4>
                            <p>Vuruş gücünü artırır.</p>
                            <div class="forge-cost">Maliyet: ${(up.weapon + 1) * 100} Altın</div>
                        </div>
                        <button class="btn-quest" onclick="upgradeItem('weapon')">Geliştir</button>
                    </div>
                    <div class="forge-card">
                        <div class="forge-info">
                            <h4>Zırh Geliştirme (+${up.armor})</h4>
                            <p>Hasar direncini artırır.</p>
                            <div class="forge-cost">Maliyet: ${(up.armor + 1) * 100} Altın</div>
                        </div>
                        <button class="btn-quest" onclick="upgradeItem('armor')">Geliştir</button>
                    </div>
                    <div class="forge-card">
                        <div class="forge-info">
                            <h4>Miğfer Geliştirme (+${up.helmet})</h4>
                            <p>Kritik savunma sağlar.</p>
                            <div class="forge-cost">Maliyet: ${(up.helmet + 1) * 100} Altın</div>
                        </div>
                        <button class="btn-quest" onclick="upgradeItem('helmet')">Geliştir</button>
                    </div>
                </div>
                <div id="forgeLog" class="quest-log" style="margin-top:15px;">Demirci tezgahı hazır...</div>
            `;
        }

        function upgradeItem(itemType) { socket.emit('upgradeItem', { itemType }); }
        socket.on('forgeResult', (res) => {
            if(res.userData) { updateHeader(res.userData); if(activeTab==='blacksmith') renderBlacksmith(); }
            const log = document.getElementById('forgeLog');
            if(log) log.innerText = res.message;
        });

        function renderChat() {
            document.getElementById('panelContentBody').innerHTML = `
                <div class="chat-container">
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Diyar meclisine mesaj yaz..." onkeypress="if(event.key==='Enter') sendChat()">
                        <button class="btn-quest" onclick="sendChat()">Gönder</button>
                    </div>
                </div>
            `;
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            if(!input || !input.value.trim()) return;
            socket.emit('sendChatMessage', { message: input.value });
            input.value = '';
        }

        socket.on('receiveChatMessage', (data) => {
            const box = document.getElementById('chatMessages');
            if(box) {
                box.innerHTML += `<div class="chat-msg"><span>[${data.username}]:</span> ${data.message}</div>`;
                box.scrollTop = box.scrollHeight;
            }
        });

        function logout() { socket.emit('logout'); }
        socket.on('logoutSuccess', () => { location.reload(); });
    </script>
</body>
</html>
