<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taht Savaşı — İmparatorluk Sistemi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #121212;
            background-image: radial-gradient(circle, #2a2218 0%, #0c0906 100%);
            color: #d4c5b9; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px;
        }

        /* Üst Oyun Çubuğu (Gladiatus Tarzı Header) */
        .game-header {
            width: 100%;
            max-width: 1000px;
            background: linear-gradient(to bottom, #2b231c, #16120e);
            border: 2px solid #544131;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            font-size: 12px;
        }

        .header-section { display: flex; align-items: center; gap: 15px; }
        .resource-item { display: flex; align-items: center; gap: 5px; font-weight: bold; color: #f3cf7a; }
        .bar-container { display: flex; flex-direction: column; gap: 2px; }
        .stat-bar-mini { width: 90px; height: 10px; background: #111; border: 1px solid #433222; border-radius: 2px; position: relative; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: linear-gradient(to right, #22c55e, #16a34a); width: 70%; }
        .stat-bar-fill.exp { background: linear-gradient(to right, #eab308, #ca8a04); width: 45%; }

        /* Ana Oyun Alanı (Sol Menü + Sağ İçerik) */
        .main-wrapper {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 15px;
        }

        /* Sol Dikey Parşömen Menü */
        .sidebar-menu {
            background: linear-gradient(to bottom, #1d1712, #110d0a);
            border: 2px solid #544131;
            border-radius: 4px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            height: fit-content;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }

        .menu-category-title {
            text-align: center;
            background: #2b231c;
            color: #f3cf7a;
            font-size: 11px;
            font-weight: bold;
            padding: 4px;
            border: 1px solid #433222;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .menu-btn {
            background: #18130f;
            border: 1px solid #3d2f23;
            color: #d4c5b9;
            padding: 7px 10px;
            text-align: left;
            font-size: 12px;
            border-radius: 2px;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .menu-btn:hover {
            background: #2b231c;
            border-color: #f3cf7a;
            color: #f3cf7a;
        }

        /* Sağ Parşömen İçerik Alanı */
        .content-panel {
            background: linear-gradient(135deg, #241c15 0%, #15100c 100%);
            border: 2px solid #544131;
            border-radius: 4px;
            padding: 20px;
            min-height: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            position: relative;
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            color: #f3cf7a;
            border-bottom: 1px solid #433222;
            padding-bottom: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Giriş / Karakter İsim Modalı */
        .modal-overlay { position: fixed; inset: 0; background: rgba(10, 6, 4, 0.95); display: flex; justify-content: center; align-items: center; z-index: 99; }
        .box { background: #17100c; padding: 30px; border-radius: 4px; border: 2px solid #b38b4d; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); }
        .box h2 { color: #f3cf7a; margin-bottom: 8px; font-size: 22px; }
        .box p { color: #a3957f; font-size: 13px; margin-bottom: 20px; }
        .box input { width: 100%; padding: 10px; border-radius: 2px; border: 1px solid #543d2b; background: #0f0a08; color: #f3cf7a; text-align: center; margin-bottom: 12px; font-size: 14px; }
        .btn-primary { width: 100%; padding: 10px; border: 1px solid #b38b4d; border-radius: 2px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); color: #0f0a08; font-size: 14px; }

        @media (max-width: 768px) {
            .main-wrapper { grid-template-columns: 1fr; }
            .game-header { flex-direction: column; gap: 8px; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- Giriş Ekranı -->
    <div id="loginModal" class="modal-overlay">
        <div class="box">
            <h2>Antik Diyara Adım At</h2>
            <p>Mücadelene başlamak için kahramanının adını gir.</p> gl
            <input type="text" id="usernameInput" placeholder="Gladyatör / Lord Adı" maxlength="15">
            <button class="btn-primary" onclick="login()">MEYDANA İN</button>
        </div>
    </div>

    <!-- Üst Bilgi Çubuğu (Header) -->
    <header class="game-header">
        <div class="header-section">
            <div class="resource-item">🪙 <span id="headerGold">0</span> Altın</div>
            <div class="resource-item" style="color: #ef4444;">💎 <span id="headerRubies">10</span> Yakut</div>
        </div>
        <div class="header-section">
            <div class="bar-container">
                <span style="font-size: 10px; color: #a3957f;">Can Puanı</span>
                <div class="stat-bar-mini"><div class="stat-bar-fill" style="width: 100%;"></div></div>
            </div>
            <div class="bar-container">
                <span style="font-size: 10px; color: #a3957f;">Tecrübe</span>
                <div class="stat-bar-mini"><div class="stat-bar-fill exp" style="width: 25%;"></div></div>
            </div>
        </div>
    </header>

    <!-- Ana Oyun Çerçevesi -->
    <div class="main-wrapper" id="mainApp" style="display: none;">
        
        <!-- Sol Dikey Menü (Binalar / Alanlar) -->
        <nav class="sidebar-menu">
            <div class="menu-category-title">İmparatorluk</div>
            <button class="menu-btn" onclick="switchTab('overview')">🏛️ Genel Durum</button>
            <button class="menu-btn" onclick="switchTab('work')">⚔️ İş / Görevler</button>
            <button class="menu-btn" onclick="switchTab('market')">🛒 Pazar Yeri</button>
            <button class="menu-btn" onclick="switchTab('blacksmith')">⚒️ Demirhane</button>
            
            <div class="menu-category-title" style="margin-top: 8px;">Topluluk</div>
            <button class="menu-btn" onclick="switchTab('chat')">📜 Diyar Meclisi</button>
        </nav>

        <!-- Sağ Ana İçerik Paneli -->
        <main class="content-panel">
            <div class="panel-title">
                <span id="panelHeaderTitle">Genel Durum</span>
                <span id="myUsernameDisplay" style="font-size: 13px; color: #a3957f;">Seviye 1</span>
            </div>
            
            <div id="panelContentBody">
                <p>Burada seçtiğin binanın veya karakter panelinin detayları yer alacak.</p>
            </div>
        </main>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function login() {
            const username = document.getElementById('usernameInput').value;
            if(!username) return;
            socket.emit('userLogin', { username: username });
        }

        socket.on('userData', (data) => {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('mainApp').style.display = 'grid';
            document.getElementById('headerGold').innerText = (data.balance || 0).toLocaleString('tr-TR');
            document.getElementById('myUsernameDisplay').innerText = `${data.username.toUpperCase()} (Seviye ${data.level || 1})`;
        });

        function switchTab(tabId) {
            const titleEl = document.getElementById('panelHeaderTitle');
            const bodyEl = document.getElementById('panelContentBody');
            
            if(tabId === 'overview') {
                titleEl.innerText = "Genel Durum & Karakter";
                bodyEl.innerHTML = `<p>Karakter istatistikleri ve ekipman paneli buraya entegre edilecek.</p>`;
            } else if(tabId === 'work') {
                titleEl.innerText = "İş / Görev Alanı";
                bodyEl.innerHTML = `<p>Altın kazanmak için seferlere çık ve görev yap.</p>`;
            } else if(tabId === 'market') {
                titleEl.innerText = "Pazar Yeri & Tımarlar";
                bodyEl.innerHTML = `<p>Tımar satın alarak pasif gelir elde et.</p>`;
            } else if(tabId === 'blacksmith') {
                titleEl.innerText = "Demirhane";
                bodyEl.innerHTML = `<p>Ekipmanlarını geliştir ve güçlen.</p>`;
            } else if(tabId === 'chat') {
                titleEl.innerText = "Diyar Meclisi (Sohbet)";
                bodyEl.innerHTML = `<p>Diğer lordlarla iletişim kur.</p>`;
            }
        }
    </script>
</body>
</html>
